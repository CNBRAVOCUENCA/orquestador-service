services:
  extraccion:
    build:
      context: ../..
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/extraccion-service.git
        SERVICE_REF: a57c25dad69dbefe95107c093f6cb9b59bdbe4cb
        # PyMuPDF: extracción rápida a Markdown (endpoint síncrono /extract del TP).
        UV_EXTRAS: --extra fast
      network: host
    environment:
      DOCUMENTOS_SERVICE_URL: http://documentos:8000
      EXTRACTOR_BACKEND: pymupdf
      EXTRACT_WORKERS: "1"
      MAX_INFLIGHT: "16"
      CACHE_ENABLED: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      documentos:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.extraccion.rule=Host(`extraccion.localhost`)
      - traefik.http.routers.extraccion-public.rule=PathPrefix(`/api/v1/extract`)
      - traefik.http.routers.extraccion-public.priority=100
      - traefik.http.routers.extraccion-public.middlewares=api-ratelimit@file,api-circuitbreaker@file
      - traefik.http.routers.extraccion-internal.entrypoints=web-internal
      - "traefik.http.routers.extraccion-internal.rule=PathPrefix(`/api/v1/extract`)"
      - traefik.http.routers.extraccion-internal.middlewares=api-circuitbreaker@file
      # Endpoint síncrono del TP de carga: POST /extract con el PDF binario.
      - traefik.http.routers.extraccion-sync.rule=Path(`/extract`)
      - traefik.http.routers.extraccion-sync.priority=100
      - traefik.http.routers.extraccion-sync.middlewares=api-ratelimit@file,api-circuitbreaker@file
      - traefik.http.routers.extraccion-sync-internal.entrypoints=web-internal
      - traefik.http.routers.extraccion-sync-internal.rule=Path(`/extract`)
      - traefik.http.routers.extraccion-sync-internal.middlewares=api-circuitbreaker@file
      - traefik.http.services.extraccion.loadbalancer.server.port=8000
    networks: [web]
