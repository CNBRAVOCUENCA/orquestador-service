services:
  resumen:
    image: "${IMAGE_NAMESPACE:-pdf-ms}/resumen:${RESUMEN_VERSION:?Set RESUMEN_VERSION in .env}"
    build:
      context: ../..
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/resumen-service.git
        SERVICE_REF: "${RESUMEN_VERSION:?Set RESUMEN_VERSION in .env}"
      network: host
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      CONSUL_SERVICE_NAME: resumen
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.resumen-consul.rule=Host(`resumen.localhost`),traefik.http.routers.resumen-public-consul.rule=PathPrefix(`/api/v1/summarize`),traefik.http.routers.resumen-public-consul.entrypoints=web,traefik.http.routers.resumen-public-consul.priority=100,traefik.http.routers.resumen-public-consul.middlewares=api-publico@file,traefik.http.routers.resumen-internal-consul.entrypoints=web-internal,traefik.http.routers.resumen-internal-consul.rule=PathPrefix(`/api/v1/summarize`),traefik.http.routers.resumen-internal-consul.middlewares=api-circuitbreaker@file,traefik.http.services.resumen-consul.loadbalancer.server.port=8000"
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [web]
