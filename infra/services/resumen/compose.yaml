services:
  resumen:
    build:
      context: ../..
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/resumen-service.git
        SERVICE_REF: c0fb3e5ee4d0576b5bde1e47b5f9a8255a871fcd
      network: host
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      CONSUL_SERVICE_NAME: resumen
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.resumen-consul.rule=Host(`resumen.localhost`),traefik.http.routers.resumen-public-consul.rule=PathPrefix(`/api/v1/summarize`),traefik.http.routers.resumen-public-consul.priority=100,traefik.http.services.resumen-consul.loadbalancer.server.port=8000"
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.resumen.rule=Host(`resumen.localhost`)
      - traefik.http.routers.resumen-public.rule=PathPrefix(`/api/v1/summarize`)
      - traefik.http.routers.resumen-public.priority=100
      - traefik.http.services.resumen.loadbalancer.server.port=8000
    networks: [web]
