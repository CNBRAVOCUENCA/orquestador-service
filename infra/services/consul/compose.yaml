services:
  consul:
    image: hashicorp/consul:1.21.5@sha256:6126c30072690cb3173a450ff5bde120c3a01e11c9dccab83b1b2314d4c828bd
    command:
      - agent
      - -server
      - -bootstrap-expect=1
      - -client=0.0.0.0
      - -data-dir=/consul/data
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [web]
