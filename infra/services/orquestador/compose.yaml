services:
  orquestador:
    build:
      context: ../../..
      dockerfile: Dockerfile
      network: host
    environment:
      DOCUMENTOS_URL: http://documentos:8000
      EXTRACCION_URL: http://extraccion:8000
      RESUMEN_URL: http://resumen:8000
      NOTIFICACIONES_URL: http://notificaciones:8000
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: "true"
    depends_on:
      documentos:
        condition: service_healthy
      extraccion:
        condition: service_healthy
      resumen:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.orquestador.rule=Host(`orquestador.localhost`)
      - traefik.http.routers.orquestador-public.rule=PathPrefix(`/api/v1/procesar`)
      - traefik.http.routers.orquestador-public.priority=100
      - traefik.http.services.orquestador.loadbalancer.server.port=8000
    networks: [web]
