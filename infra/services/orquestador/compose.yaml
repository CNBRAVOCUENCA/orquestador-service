services:
  orquestador:
    image: "${IMAGE_NAMESPACE:-pdf-ms}/orquestador:${ORQUESTADOR_VERSION:?Set ORQUESTADOR_VERSION in .env}"
    build:
      context: ../../..
      dockerfile: Dockerfile
      network: host
    environment:
      DOCUMENTOS_URL: http://traefik:8081
      EXTRACCION_URL: http://traefik:8081
      RESUMEN_URL: http://traefik:8081
      NOTIFICACIONES_URL: http://traefik:8081
      # /ready consulta el /health de cada servicio directo (Traefik no publica /health)
      DOCUMENTOS_HEALTH_URL: http://documentos:8000
      EXTRACCION_HEALTH_URL: http://extraccion:8000
      RESUMEN_HEALTH_URL: http://resumen:8000
      NOTIFICACIONES_HEALTH_URL: http://notificaciones:8000
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: "true"
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      CONSUL_SERVICE_NAME: orquestador
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.orquestador-consul.rule=Host(`${ORQUESTADOR_HOST:-orquestador.localhost}`),traefik.http.routers.orquestador-public-consul.rule=PathPrefix(`/api/v1/procesar`),traefik.http.routers.orquestador-public-consul.entrypoints=web,traefik.http.routers.orquestador-public-consul.priority=100,traefik.http.services.orquestador-consul.loadbalancer.server.port=8000"
    depends_on:
      consul:
        condition: service_healthy
      traefik:
        condition: service_healthy
      documentos:
        condition: service_healthy
      extraccion:
        condition: service_healthy
      resumen:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - "traefik.http.routers.orquestador.rule=Host(`${ORQUESTADOR_HOST:-orquestador.localhost}`)"
      - traefik.http.routers.orquestador-public.rule=PathPrefix(`/api/v1/procesar`)
      - traefik.http.routers.orquestador-public.entrypoints=web
      - traefik.http.routers.orquestador-public.priority=100
      - traefik.http.routers.orquestador-public.middlewares=api-ratelimit@file,api-circuitbreaker@file
      - traefik.http.services.orquestador.loadbalancer.server.port=8000
    networks: [web]
