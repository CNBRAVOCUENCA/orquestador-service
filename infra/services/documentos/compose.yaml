services:
  documentos:
    image: "${IMAGE_NAMESPACE:-pdf-ms}/documentos:${DOCUMENTOS_VERSION:?Set DOCUMENTOS_VERSION in .env}"
    build:
      context: ../..
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/documentos-service.git
        SERVICE_REF: "${DOCUMENTOS_VERSION:?Set DOCUMENTOS_VERSION in .env}"
      network: host
    environment:
      DATABASE_URL: mongodb://mongo:27017
      DATABASE_NAME: documentos_service
      EXTRACTION_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?Configura INTERNAL_SERVICE_API_KEY en .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: documentos
      CONSUL_HTTP_ADDR: http://consul:8500
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      CONSUL_SERVICE_NAME: documentos
      CONSUL_SERVICE_PORT: "8000"
      CONSUL_SERVICE_TAGS: "traefik.enable=true,traefik.http.routers.documentos-consul.rule=Host(`documentos.localhost`),traefik.http.routers.documentos-public-consul.rule=PathPrefix(`/api/v1/documents`),traefik.http.routers.documentos-public-consul.entrypoints=web,traefik.http.routers.documentos-public-consul.priority=100,traefik.http.routers.documentos-public-consul.middlewares=api-publico@file,traefik.http.routers.documentos-internal-consul.entrypoints=web-internal,traefik.http.routers.documentos-internal-consul.rule=PathPrefix(`/api/v1/documents`),traefik.http.routers.documentos-internal-consul.middlewares=api-circuitbreaker@file,traefik.http.routers.documentos-docs-consul.rule=PathPrefix(`/docs`) || Path(`/openapi.json`),traefik.http.routers.documentos-docs-consul.entrypoints=web,traefik.http.routers.documentos-docs-consul.priority=90,traefik.http.services.documentos-consul.loadbalancer.server.port=8000"
    depends_on:
      consul:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [web]
