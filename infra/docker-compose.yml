# Punto de entrada del stack: cada servicio mantiene su Compose en services/<nombre>/.
# Requiere Docker Compose v2.20 o posterior para la directiva include.

include:
  - services/traefik/compose.yaml
  - services/cloudflared/compose.yaml
  - services/redis/compose.yaml
  - services/mongo/compose.yaml
  - services/documentos/compose.yaml
  - services/extraccion/compose.yaml
  - services/resumen/compose.yaml
  - services/notificaciones/compose.yaml
  - services/orquestador/compose.yaml

volumes:
  mongo_data:

networks:
  web:
