# Sistema completo El-Destripador-de-PDFs (microservicios + Traefik + Redis + Mongo)
#
# Uso:
#   docker compose up --build
#
# Cada microservicio debe estar clonado como carpeta hermana de esta:
#   ../documentos-service, ../extraccion-service, ../resumen-service,
#   ../notificaciones-service, ../orquestador-service
# (ajustar los `build:` si tu layout es distinto)

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"        # gateway
      - "8080:8080"    # dashboard de Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://traefik:80
    depends_on:
      traefik:
        condition: service_healthy
    networks: [web]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [web]

  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [web]

  documentos:
    build:
      context: ../../documentos-service
      network: host
    environment:
      DATABASE_URL: mongodb://mongo:27017
      DATABASE_NAME: documentos_service
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.documentos.rule=Host(`documentos.localhost`)
      - traefik.http.routers.documentos-public.rule=PathPrefix(`/api/v1/documents`)
      - traefik.http.routers.documentos-public.priority=100
      - traefik.http.services.documentos.loadbalancer.server.port=8000
    networks: [web]

  extraccion:
    build:
      context: ../../extraccion-service
      network: host
    environment:
      DOCUMENTOS_SERVICE_URL: http://documentos:8000
    depends_on:
      documentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.extraccion.rule=Host(`extraccion.localhost`)
      - traefik.http.services.extraccion.loadbalancer.server.port=8000
    networks: [web]

  resumen:
    build:
      context: ../../resumen-service
      network: host
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.resumen.rule=Host(`resumen.localhost`)
      - traefik.http.services.resumen.loadbalancer.server.port=8000
    networks: [web]

  notificaciones:
    build:
      context: ../../notificaciones-service
      network: host
    environment:
      DATABASE_URL: mongodb://mongo:27017
      DATABASE_NAME: notificaciones_service
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.notificaciones.rule=Host(`notificaciones.localhost`)
      - traefik.http.services.notificaciones.loadbalancer.server.port=8000
    networks: [web]

  orquestador:
    build:
      context: ../
      network: host
    environment:
      EXTRACCION_URL: http://extraccion:8000
      RESUMEN_URL: http://resumen:8000
      NOTIFICACIONES_URL: http://notificaciones:8000
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: "true"
    depends_on:
      extraccion:
        condition: service_healthy
      resumen:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.orquestador.rule=Host(`orquestador.localhost`)
      - traefik.http.routers.orquestador-public.rule=PathPrefix(`/api/v1/procesar`)
      - traefik.http.routers.orquestador-public.priority=100
      - traefik.http.services.orquestador.loadbalancer.server.port=8000
    networks: [web]

volumes:
  mongo_data:

networks:
  web:
