# Sistema completo El-Destripador-de-PDFs (microservicios + Traefik + Redis + Mongo)
#
# Uso:
#   docker compose up --build
#
# Los cuatro servicios dependientes se construyen directamente desde GitHub.
# Solo hace falta clonar este repositorio y configurar GEMINI_API_KEY en .env.

services:
  traefik:
    image: traefik@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.network=infra_web
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"        # gateway
      - "8080:8080"    # dashboard de Traefik
    environment:
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  cloudflared:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: tunnel --no-autoupdate --url http://traefik:80
    depends_on:
      traefik:
        condition: service_healthy
    networks: [web]

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [web]

  mongo:
    image: mongo@sha256:4a0f30875898413139bec44c73c02a05fed172578de65b644dcdcee143ae7306
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [web]

  documentos:
    build:
      context: .
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/documentos-service.git
        SERVICE_REF: 05b245e6941d5309ff83c333b7f966664a7ec38e
      network: host
    environment:
      DATABASE_URL: mongodb://mongo:27017
      DATABASE_NAME: documentos_service
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.documentos.rule=Host(`documentos.localhost`)
      - traefik.http.routers.documentos-public.rule=PathPrefix(`/api/v1/documents`)
      - traefik.http.routers.documentos-public.priority=100
      - traefik.http.routers.documentos-docs.rule=PathPrefix(`/docs`) || Path(`/openapi.json`)
      - traefik.http.routers.documentos-docs.priority=90
      - traefik.http.services.documentos.loadbalancer.server.port=8000
    networks: [web]

  extraccion:
    build:
      context: .
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/extraccion-service.git
        SERVICE_REF: 4a4f318b75d803a3b7c43d0aca231b7e74c13d85
      network: host
    environment:
      DOCUMENTOS_SERVICE_URL: http://documentos:8000
    depends_on:
      documentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.extraccion.rule=Host(`extraccion.localhost`)
      - traefik.http.routers.extraccion-public.rule=PathPrefix(`/api/v1/extract`)
      - traefik.http.routers.extraccion-public.priority=100
      - traefik.http.services.extraccion.loadbalancer.server.port=8000
    networks: [web]

  resumen:
    build:
      context: .
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/resumen-service.git
        SERVICE_REF: e8e6b8ce349ef20371d1cf622cc8348588ef5c5c
      network: host
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.resumen.rule=Host(`resumen.localhost`)
      - traefik.http.routers.resumen-public.rule=PathPrefix(`/api/v1/summarize`)
      - traefik.http.routers.resumen-public.priority=100
      - traefik.http.services.resumen.loadbalancer.server.port=8000
    networks: [web]

  notificaciones:
    build:
      context: .
      dockerfile: Dockerfile.remote
      args:
        SERVICE_REPO: https://github.com/CNBRAVOCUENCA/notificaciones-service.git
        SERVICE_REF: 0c65772a1e2ab972f1f0466b7204c3dbe14b9941
      network: host
    environment:
      DATABASE_URL: mongodb://mongo:27017
      DATABASE_NAME: notificaciones_service
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.notificaciones.rule=Host(`notificaciones.localhost`)
      - traefik.http.routers.notificaciones-public.rule=PathPrefix(`/api/v1/estados`)
      - traefik.http.routers.notificaciones-public.priority=100
      - traefik.http.services.notificaciones.loadbalancer.server.port=8000
    networks: [web]

  orquestador:
    build:
      context: ../
      network: host
    environment:
      DOCUMENTOS_URL: http://documentos:8000
      EXTRACCION_URL: http://extraccion:8000
      RESUMEN_URL: http://resumen:8000
      NOTIFICACIONES_URL: http://notificaciones:8000
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: "true"
    depends_on:
      documentos:
        condition: service_healthy
      extraccion:
        condition: service_healthy
      resumen:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.orquestador.rule=Host(`orquestador.localhost`)
      - traefik.http.routers.orquestador-public.rule=PathPrefix(`/api/v1/procesar`)
      - traefik.http.routers.orquestador-public.priority=100
      - traefik.http.services.orquestador.loadbalancer.server.port=8000
    networks: [web]

volumes:
  mongo_data:

networks:
  web:
